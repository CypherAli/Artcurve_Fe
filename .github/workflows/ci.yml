# ─────────────────────────────────────────────────────────────────────────────
#  ArtCurve Frontend — CI/CD
#
#  CI: lint → test (jest) → build (type-check + production bundle).
#  CD: Vercel auto-deploy khi push main; job `deploy` xác nhận production
#      trả HTTP 200 sau deploy (Vercel không ngủ đông nên gate này tin được).
# ─────────────────────────────────────────────────────────────────────────────
name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-test:
    name: Lint · Test · Build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Unit tests (jest)
        run: npm test -- --ci

      - name: Build (type-check + production bundle)
        run: npm run build
        env:
          NEXT_PUBLIC_WALLETCONNECT_PROJECT_ID: CI_PLACEHOLDER

  # ── CD: Vercel tự deploy khi push main — job này xác nhận FE live ─────────
  deploy:
    name: Deploy status (Vercel)
    needs: build-and-test
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - name: Chờ FE production trả 200
        run: |
          echo "Vercel auto-deploy được trigger bởi commit ${GITHUB_SHA::7}."
          for i in $(seq 1 20); do
            code=$(curl -s -o /dev/null -w "%{http_code}" -m 30 \
              https://artcurve-fe.vercel.app || true)
            if [ "$code" = "200" ]; then
              echo "✅ FE production live (HTTP 200)" >> "$GITHUB_STEP_SUMMARY"
              exit 0
            fi
            echo "attempt $i/20: HTTP $code — đợi 15s..."
            sleep 15
          done
          echo "❌ FE không trả 200 sau 5 phút — kiểm tra dashboard Vercel." >> "$GITHUB_STEP_SUMMARY"
          exit 1
