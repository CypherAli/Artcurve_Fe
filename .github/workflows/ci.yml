name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Build (type-check + production bundle)
        run: npm run build
        env:
          NEXT_PUBLIC_WALLETCONNECT_PROJECT_ID: CI_PLACEHOLDER

  # CD: Vercel tự deploy khi push main.
  # Job này hiển thị bước deploy trong tab Actions + đợi FE live.
  deploy:
    needs: build-and-test
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - name: Vercel auto-deploy đã được trigger bởi push này
        run: echo "Vercel đang build & deploy commit ${GITHUB_SHA::7}..."

      - name: Chờ FE production trả 200
        run: |
          for i in $(seq 1 20); do
            code=$(curl -s -o /dev/null -w "%{http_code}" -m 30 \
              https://artcurve-fe.vercel.app || true)
            if [ "$code" = "200" ]; then
              echo "✅ FE production live (HTTP 200)"
              exit 0
            fi
            echo "attempt $i/20: HTTP $code — đợi 15s..."
            sleep 15
          done
          exit 1
