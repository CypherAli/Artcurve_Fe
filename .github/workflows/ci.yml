# ─────────────────────────────────────────────────────────────────────────────
#  ArtCurve Frontend — CI
#
#  CI THUẦN: lint → test → build, sinh artifact, dừng ở đó.
#  Deploy verification nằm ở cd.yml (chạy sau khi CI xanh).
#
#  Artifacts:
#    test-coverage — báo cáo coverage của jest
#    next-build    — production bundle (.next) đã build & type-check
# ─────────────────────────────────────────────────────────────────────────────
name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-test:
    name: Lint · Test · Build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Unit tests (jest + coverage)
        run: npm test -- --ci --coverage

      - name: Upload artifact — test coverage
        uses: actions/upload-artifact@v4
        with:
          name: test-coverage
          path: coverage/
          retention-days: 7

      - name: Build (type-check + production bundle)
        run: npm run build
        env:
          NEXT_PUBLIC_WALLETCONNECT_PROJECT_ID: CI_PLACEHOLDER

      - name: Upload artifact — production build
        uses: actions/upload-artifact@v4
        with:
          name: next-build
          path: |
            .next/
            !.next/cache
          retention-days: 7
